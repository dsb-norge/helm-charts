suite: test springConfig written out as a mounted Spring config file
templates:
  - deployment.yaml
  - springConfigMap.yaml
tests:
  - it: should render no ConfigMap when springConfig is not set
    template: springConfigMap.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should render no ConfigMap when springConfig is empty
    template: springConfigMap.yaml
    set:
      springConfig: {}
    asserts:
      - hasDocuments:
          count: 0
  - it: should not touch the deployment when springConfig is not set
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_CONFIG_ADDITIONAL_LOCATION
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spring-config
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: spring-config
          any: true
  - it: should not touch the deployment when springConfig is empty
    template: deployment.yaml
    set:
      springConfig: {}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_CONFIG_ADDITIONAL_LOCATION
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: spring-config
          any: true
  - it: should keep configurationConfigMap's location alone when springConfig is not set
    template: deployment.yaml
    set:
      configurationConfigMap: my-spring-configuration
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_CONFIG_ADDITIONAL_LOCATION
            value: "/spring-configuration/"
          count: 1
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: spring-config
          any: true
  - it: should write springConfig to a ConfigMap named after the release
    template: springConfigMap.yaml
    release:
      name: my-app
      namespace: my-namespace
    set:
      springConfig:
        my.feature:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: my-app-spring-config
      - equal:
          path: metadata.namespace
          value: my-namespace
      - equal:
          path: data["application.yaml"]
          value: |
            my.feature:
              enabled: true
  - it: should mount the file and point Spring at it when springConfig is set
    template: deployment.yaml
    release:
      name: my-app
    set:
      springConfig:
        my.feature:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_CONFIG_ADDITIONAL_LOCATION
            value: "/spring-config/application.yaml"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spring-config
            mountPath: /spring-config
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spring-config
            configMap:
              name: my-app-spring-config
  - it: should put springConfig's file after configurationConfigMap's location, so it overrides it
    template: deployment.yaml
    set:
      configurationConfigMap: my-spring-configuration
      springConfig:
        my.feature:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_CONFIG_ADDITIONAL_LOCATION
            value: "/spring-configuration/,/spring-config/application.yaml"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spring-configuration
            mountPath: /spring-configuration
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spring-config
            mountPath: /spring-config
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spring-configuration
            configMap:
              name: my-spring-configuration
  - it: should keep YAML's types, where config would turn them into environment variables' text
    template: springConfigMap.yaml
    set:
      springConfig:
        dsb.security.entra:
          tenant-id: "00000000-0000-0000-0000-000000000000"
          audience: "00000000-0000-0000-0000-000000000001"
          implications:
            - role: Certificate.Write
              implies:
                - Certificate.Read
          keycloak-aliases:
            - keycloak: Bergsprenger.LES
              role: Certificate.Read
            - keycloak: SYSTEM
              clients:
                - altinn-forms
              role: Altinn.Ingest
          downstream:
            citizen-service:
              scope: "api://00000000-0000-0000-0000-000000000002/.default"
              as:
                - app
        types:
          enabled: true
          disabled: false
          retries: 3
          ratio: 0.5
          quoted-number: "3"
          quoted-boolean: "true"
    asserts:
      - equal:
          path: data["application.yaml"]
          value: |
            dsb.security.entra:
              audience: 00000000-0000-0000-0000-000000000001
              downstream:
                citizen-service:
                  as:
                  - app
                  scope: api://00000000-0000-0000-0000-000000000002/.default
              implications:
              - implies:
                - Certificate.Read
                role: Certificate.Write
              keycloak-aliases:
              - keycloak: Bergsprenger.LES
                role: Certificate.Read
              - clients:
                - altinn-forms
                keycloak: SYSTEM
                role: Altinn.Ingest
              tenant-id: 00000000-0000-0000-0000-000000000000
            types:
              disabled: false
              enabled: true
              quoted-boolean: "true"
              quoted-number: "3"
              ratio: 0.5
              retries: 3
  - it: should fail when springConfig is not a map
    template: springConfigMap.yaml
    set:
      springConfig: "my.feature.enabled: true"
    asserts:
      - failedTemplate:
          errorMessage: "springConfig must be a map of Spring properties, got a string"
